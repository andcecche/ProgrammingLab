name: Python Application Test

# Esegui l'azione ogni volta che fai un push sul branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice del repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Installa le dipendenze
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Esegui i test automatici
      run: |
        # Sostituisci questo comando con quello che usi per testare il tuo codice
        # es. python test.py oppure pytest
        echo "Esecuzione dei test superata con successo!"